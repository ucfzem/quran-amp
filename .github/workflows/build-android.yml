name: Build & Release Android APK (quran-amp)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Apply Patches
        run: |
          npm ci
          npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # OPTION A : BUILD RELEASE SIGNÉ
      - name: Decode Keystore File
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Signed Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build Signed Release AAB
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quran-amp-release-signed
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # OPTION B : BUILD DEBUG FALLBACK
      - name: Build Debug APK (Fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        if: steps.check_keystore.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: quran-amp-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # RELEASE GITHUB AUTOMATIQUE (tags v*.*.*)
      - name: Determine Target APK Path
        if: startsWith(github.ref, 'refs/tags/')
        id: apk_path
        run: |
          if [ "${{ steps.check_keystore.outputs.has_keystore }}" = "true" ]; then
            echo "file=mobile/android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "name=quran-amp-${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT
          else
            echo "file=mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "name=quran-amp-${{ github.ref_name }}-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.apk_path.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
