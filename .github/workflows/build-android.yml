name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web (fonts + bridge + obfuscation) and sync
        working-directory: mobile
        run: npm run build:web && npx cap sync android

      - name: Build debug APK (installable)
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Build release AAB (Play Store)
        working-directory: mobile/android
        run: ./gradlew bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-amp-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
