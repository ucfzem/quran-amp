<!DOCTYPE html><html lang="ar" data-theme="dark" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winamp Quran Player - TV Gold Edition</title>
  <link href="css/fonts.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=VT323&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg-color: #120e0b;
      --chassis-bg: linear-gradient(145deg, #322319, #1c130d);
      --chassis-border: #7a5c32;
      --lcd-bg: #0b0904;
      --lcd-text: #ffd700;
      --lcd-glow: rgba(255, 215, 0, 0.25);
      --btn-bg: linear-gradient(180deg, #4d3826 0%, #2b1d12 100%);
      --btn-border: #96733e;
      --btn-text: #f5e6c8;
      --text-main: #f5e6c8;
      --panel-bg: #1a120b;
      --accent: #d4af37;
      --gold-gradient: linear-gradient(90deg, #7a5c32, #d4af37, #7a5c32);
      --focus-ring: #ffe600;
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }


    [data-theme="light"] {
      --bg-color: #f4efe6;
      --chassis-bg: linear-gradient(145deg, #e8dfd1, #cdbfab);
      --chassis-border: #a88448;
      --lcd-bg: #2a2010;
      --lcd-text: #ffcc00;
      --lcd-glow: rgba(255, 204, 0, 0.3);
      --btn-bg: linear-gradient(180deg, #ffffff 0%, #dfd3c3 100%);
      --btn-border: #b8975a;
      --btn-text: #3d2b1f;
      --text-main: #3d2b1f;
      --panel-bg: #e2d7c7;
      --accent: #966f2d;
      --gold-gradient: linear-gradient(90deg, #b8975a, #f3e5ab, #b8975a);
      --focus-ring: #d4af37;
      --modal-overlay: rgba(0, 0, 0, 0.65);
    }


    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      transition: background 0.3s, color 0.3s;
    }


    .winamp-container {
      width: 100%;
      max-width: min(94vw, 580px);
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 10px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85), inset 1px 1px 0 rgba(255,230,150,0.25);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }


    :focus, :focus-visible {
      outline: 3px solid var(--focus-ring) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 12px var(--focus-ring) !important;
    }


    .title-bar {
      background: var(--gold-gradient);
      color: #120e0b;
      font-size: 14px;
      font-weight: bold;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
    }


    .title-bar-controls { display: flex; gap: 6px; }
    
    .win-btn {
      min-width: 32px; height: 26px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      font-size: 12px; line-height: 24px; text-align: center; 
      color: var(--btn-text); cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      padding: 0 6px;
    }


    .lcd-screen {
      background-color: var(--lcd-bg);
      border: 2px inset var(--chassis-border);
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: inset 0 0 12px var(--lcd-glow);
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      align-items: center;
    }


    .lcd-info { overflow: hidden; text-align: right; }
    
    .lcd-ticker {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 20px;
      white-space: nowrap;
      text-shadow: 0 0 6px var(--lcd-text);
      animation: ticker-rtl 12s linear infinite;
      display: inline-block;
    }


    @keyframes ticker-rtl {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }


    .lcd-timer {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 24px;
      text-shadow: 0 0 6px var(--lcd-text);
      margin-top: 2px;
    }


    .lcd-ayah-count {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 15px;
      opacity: 0.85;
      margin-top: 2px;
    }


    canvas#spectrum {
      width: 100px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--chassis-border);
      border-radius: 4px;
      cursor: pointer;
    }


    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }


    .reciter-trigger-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 8px 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Tajawal', sans-serif;
    }


    .reciter-trigger-btn::after {
      content: '▼';
      font-size: 11px;
      color: var(--accent);
    }


    .transport-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }


    .btn-winamp {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      color: var(--btn-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
    }


    .btn-winamp.btn-main {
      width: 50px;
      height: 50px;
    }


    .btn-winamp svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }


    .btn-winamp.btn-main svg {
      width: 22px;
      height: 22px;
    }


    .btn-winamp:hover svg, .btn-winamp:focus svg {
      fill: #ffffff;
    }


    .sliders {
      display: flex;
      gap: 10px;
      align-items: center;
    }


    input[type=range] {
      -webkit-appearance: none;
      background: #000;
      height: 10px;
      border-radius: 5px;
      border: 1px solid var(--chassis-border);
    }


    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 18px;
      background: var(--accent);
      border: 1px solid #fff;
      border-radius: 3px;
      cursor: pointer;
    }


    .seek-bar { flex: 2; }
    .volume-bar { flex: 1; }


    .playlist-window {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      height: 130px;
      overflow-y: auto;
      font-size: 15px;
      border-radius: 6px;
      scroll-behavior: smooth;
    }


    .playlist-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }


    .playlist-item:hover, .playlist-item:focus {
      background: rgba(212, 175, 55, 0.25);
    }
    
    .playlist-item.active {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    .quran-text-container {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      padding: 12px;
      height: 150px;
      overflow-y: auto;
      text-align: center;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-behavior: smooth;
    }


    .ar-text {
      font-family: 'Amiri', serif;
      font-size: clamp(18px, 2.5vw, 26px);
      color: var(--accent);
      direction: rtl;
      line-height: 1.6;
      font-weight: bold;
      white-space: pre-line;
      width: 100%;
    }


    .ayah-marker {
      color: var(--lcd-text);
      font-size: 0.7em;
      font-weight: normal;
    }


    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }


    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }


    .modal-card {
      background: var(--panel-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }


    .modal-header {
      background: var(--gold-gradient);
      color: #120e0b;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #120e0b;
      cursor: pointer;
    }


    .modal-list {
      overflow-y: auto;
      padding: 6px 0;
      max-height: 60vh;
    }


    .reciter-option {
      padding: 10px 16px;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .reciter-option:hover, .reciter-option:focus {
      background: rgba(212, 175, 55, 0.25);
    }


    .reciter-option.selected {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--chassis-border); border-radius: 3px; }
  </style>
</head>
<body>


  <div class="winamp-container" id="app-container">
    <div class="title-bar">
      <span id="app-title">ويناتمب - مشغل القرآن الكريم</span>
      <div class="title-bar-controls">
        <button class="win-btn" id="btn-theme" tabindex="0">☀</button>
      </div>
    </div>


    <div class="lcd-screen">
      <canvas id="spectrum" width="100" height="40" tabindex="0" title="انقر لتغيير النمط"></canvas>
      <div class="lcd-info">
        <div class="lcd-ticker" id="lcd-title">اضغط تشغيل للبدء</div>
        <div class="lcd-timer" id="lcd-time">00:00</div>
        <div class="lcd-ayah-count" id="lcd-ayah-count"></div>
      </div>
    </div>


    <div class="controls-panel">
      <button class="reciter-trigger-btn" id="reciter-btn" tabindex="0">
        <span id="reciter-label">محمود خليل الحصري</span>
      </button>


      <div class="transport-buttons">
        <button class="btn-winamp" id="btn-prev" tabindex="0" title="السابقة">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-stop" tabindex="0" title="إيقاف">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button class="btn-winamp btn-main" id="btn-play" tabindex="0" title="تشغيل">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-pause" tabindex="0" title="إيقاف مؤقت">
          <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-next" tabindex="0" title="التالية">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>


      <div class="sliders">
        <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" step="0.1" tabindex="0">
        <input type="range" id="volume-bar" class="volume-bar" value="80" min="0" max="100" tabindex="0">
      </div>
    </div>


    <div class="playlist-window" id="playlist"></div>


    <div class="quran-text-container" id="text-container" tabindex="0">
      <div class="ar-text" id="ar-text">اخْتَر سُورَة لِلْبَدْء</div>
    </div>
  </div>


  <div class="modal-overlay" id="reciter-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span>اختر القارئ</span>
        <button class="modal-close-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-list" id="reciter-list"></div>
    </div>
  </div>


  <audio id="audio-player" playsinline></audio>


  <script src="js/native-bridge.js"></script>
