<!DOCTYPE html><html lang="fr" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winamp Quran Player - TV Gold Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=VT323&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">




  <style>
    :root {
      --bg-color: #1a1410;
      --chassis-bg: linear-gradient(145deg, #3d2b1f, #241810);
      --chassis-border: #8b6b3e;
      --lcd-bg: #110e05;
      --lcd-text: #ffd700;
      --lcd-glow: rgba(255, 215, 0, 0.25);
      --btn-bg: linear-gradient(145deg, #5c432d, #3a281a);
      --btn-border: #a88448;
      --btn-text: #f5e6c8;
      --btn-active: #ffe600;
      --text-main: #f5e6c8;
      --panel-bg: #22170f;
      --accent: #d4af37;
      --gold-gradient: linear-gradient(90deg, #8b6b3e, #d4af37, #8b6b3e);
      --focus-ring: #ffe600;
    }




    [data-theme="light"] {
      --bg-color: #f4efe6;
      --chassis-bg: linear-gradient(145deg, #e8dfd1, #cdbfab);
      --chassis-border: #a88448;
      --lcd-bg: #2a2010;
      --lcd-text: #ffcc00;
      --lcd-glow: rgba(255, 204, 0, 0.3);
      --btn-bg: linear-gradient(145deg, #ffffff, #dfd3c3);
      --btn-border: #b8975a;
      --btn-text: #3d2b1f;
      --btn-active: #d4af37;
      --text-main: #3d2b1f;
      --panel-bg: #e2d7c7;
      --accent: #966f2d;
      --gold-gradient: linear-gradient(90deg, #b8975a, #f3e5ab, #b8975a);
      --focus-ring: #d4af37;
    }




    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.3s, color 0.3s;
    }




    /* TV Responsive Winamp Container */
    .winamp-container {
      width: 100%;
      max-width: min(92vw, 640px);
      background: var(--chassis-bg);
      border: 4px solid var(--chassis-border);
      border-radius: 8px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.8), inset 1px 1px 0 rgba(255,230,150,0.3);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }




    /* Spatial Navigation Focus Styles */
    :focus, :focus-visible {
      outline: 3px solid var(--focus-ring) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 12px var(--focus-ring) !important;
    }




    /* Title Bar */
    .title-bar {
      background: var(--gold-gradient);
      color: #1a1410;
      font-size: 14px;
      font-weight: bold;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 3px;
      letter-spacing: 1px;
    }




    .title-bar-controls { display: flex; gap: 8px; }
    
    .win-btn {
      min-width: 32px; height: 26px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      font-size: 12px; line-height: 24px; text-align: center; 
      color: var(--btn-text); cursor: pointer;
      border-radius: 3px;
      font-weight: bold;
      padding: 0 6px;
    }




    /* LCD Screen */
    .lcd-screen {
      background-color: var(--lcd-bg);
      border: 2px inset var(--chassis-border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: inset 0 0 12px var(--lcd-glow);
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
    }




    .lcd-info { overflow: hidden; }
    
    .lcd-ticker {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 22px;
      white-space: nowrap;
      text-shadow: 0 0 6px var(--lcd-text);
      animation: ticker 12s linear infinite;
      display: inline-block;
    }




    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }




    [dir="rtl"] .lcd-ticker {
      animation: ticker-rtl 12s linear infinite;
    }




    @keyframes ticker-rtl {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }




    .lcd-timer {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 28px;
      text-shadow: 0 0 6px var(--lcd-text);
      margin-top: 4px;
    }




    canvas#spectrum {
      width: 120px;
      height: 48px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--chassis-border);
      border-radius: 3px;
    }




    /* Controls Panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }




    .selectors { display: flex; gap: 8px; }




    select {
      flex: 1;
      height: 52px;
      background-color: var(--panel-bg);
      color: var(--text-main);
      border: 1px solid var(--btn-border);
      padding: 8px 16px;
      font-size: 18px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }




    .transport-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }




    .btn-winamp {
      flex: 1;
      height: 48px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.15), 1px 2px 3px rgba(0,0,0,0.4);
    }




    .btn-winamp:active {
      border-style: inset;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
      color: var(--btn-active);
    }




    .sliders {
      display: flex;
      gap: 14px;
      align-items: center;
    }




    input[type=range] {
      -webkit-appearance: none;
      background: #000;
      height: 12px;
      border-radius: 6px;
      border: 1px solid var(--chassis-border);
    }




    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 22px;
      background: var(--accent);
      border: 1px solid #fff;
      border-radius: 3px;
      cursor: pointer;
    }




    .seek-bar { flex: 2; }
    .volume-bar { flex: 1; }




    /* Playlist Window */
    .playlist-window {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      height: 160px;
      overflow-y: auto;
      font-size: 15px;
      border-radius: 4px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }




    .playlist-item {
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }




    .playlist-item:hover, .playlist-item:focus {
      background: rgba(212, 175, 55, 0.25);
    }
    
    .playlist-item.active {
      background: var(--accent);
      color: #1a1410;
      font-weight: bold;
    }




    /* Quran Text Display Window */
    .quran-text-container {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      padding: 14px;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      text-align: center;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: flex-start;
      scroll-behavior: smooth;
    }




    .ar-text {
      font-family: 'Amiri', serif;
      font-size: 26px;
      color: var(--accent);
      direction: rtl;
      line-height: 1.6;
      font-weight: bold;
      white-space: pre-line;
    }




    .fr-text {
      font-size: 15px;
      opacity: 0.9;
      line-height: 1.4;
      white-space: pre-line;
    }




    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--chassis-border); border-radius: 4px; }


    /* TV Font & Hit Target Adjustments */
    .ar-text {
      font-size: clamp(32px, 4vw, 44px) !important;
      line-height: 1.8;
    }


    .fr-text {
      font-size: clamp(18px, 2vw, 24px) !important;
    }


    .playlist-item {
      padding: 14px 16px !important;
      font-size: 18px !important;
    }


    .btn-winamp {
      height: 56px !important;
      font-size: 20px !important;
    }


    /* --- Custom Reciter Picker (replaces native <select> popup) --- */
    .reciter-picker { flex: 1; position: relative; }


    .reciter-trigger {
      width: 100%;
      height: 52px;
      background-color: var(--panel-bg);
      color: var(--text-main);
      border: 1px solid var(--btn-border);
      padding: 8px 16px;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .reciter-trigger .arrow { opacity: 0.7; font-size: 14px; }


    .reciter-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .reciter-modal:not(.hidden) { opacity: 1; pointer-events: auto; }
    .reciter-modal.hidden { display: none; }


    .reciter-modal-content {
      background: var(--panel-bg);
      color: var(--text-main);
      border: 2px solid var(--chassis-border);
      border-radius: 8px;
      width: 88%;
      max-width: 400px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }


    .reciter-modal-header {
      padding: 12px 16px;
      background: var(--gold-gradient);
      color: #1a1410;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .reciter-modal-close {
      background: none;
      border: none;
      color: #1a1410;
      font-size: 1.3rem;
      cursor: pointer;
    }


    .reciter-list {
      list-style: none;
      overflow-y: auto;
      max-height: 55vh;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }


    .reciter-item {
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 17px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
      cursor: pointer;
      outline: none;
    }


    .reciter-item:hover,
    .reciter-item:focus,
    .reciter-item.selected {
      background: var(--accent) !important;
      color: #1a1410 !important;
      outline: 2px solid var(--focus-ring) !important;
      outline-offset: -2px !important;
    }
  </style>
</head>
<body>

    <div class="controls-panel">

        <button class="btn-winamp" id="btn-play" tabindex="0">&gt;</button>

        <input type="range" id="volume-bar" class="volume-bar" value="80" min="0" max="100" tabindex="0">
      </div>
    </div>




    <div class="playlist-window" id="playlist" tabindex="0"></div>




    <div class="quran-text-container" id="text-container" tabindex="0">
      <div class="ar-text" id="ar-text">اخْتَر سُورَة لِلْبَدْء</div>
      <div class="fr-text" id="fr-text">Sélectionnez une sourate pour commencer</div>
    </div>
  </div>




  <audio id="audio-player" playsinline></audio>




  <script>
    let surahs = [];
    let currentSurahIndex = 0;
    let currentAyahIndex = 0;
    let currentAyahsAr = [];
    let currentAyahsFr = [];
    let currentLang = 'fr';
    let audioCtx, analyser, source, canvasCtx;
    let isAudioInitialized = false;
    let isBasmalahPlaying = false;
    let isScrollThrottled = false;




    const i18n = {
      fr: { title: "WINAMP - LECTEUR CORAN", loading: "Chargement...", ayah: "Verset", error: "Erreur de connexion", reciter: "Récitateur" },
      ar: { title: "ويناتمب - مشغل القرآن الكريم", loading: "جاري التحميل...", ayah: "الآية", error: "خطأ في الاتصال", reciter: "القارئ" }
    };




    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const lcdTitle = document.getElementById('lcd-title');
    const lcdTime = document.getElementById('lcd-time');
    const playlistEl = document.getElementById('playlist');
    const reciterSelect = document.getElementById('reciter-select');
    const themeBtn = document.getElementById('btn-theme');
    const langBtn = document.getElementById('btn-lang');
    const arTextEl = document.getElementById('ar-text');
    const frTextEl = document.getElementById('fr-text');
    const textContainer = document.getElementById('text-container');
    const appTitleEl = document.getElementById('app-title');
    const canvas = document.getElementById('spectrum');


    // Custom reciter picker refs
    const reciterTrigger = document.getElementById('reciter-trigger');
    const reciterTriggerText = document.getElementById('reciter-trigger-text');
    const reciterModal = document.getElementById('reciter-modal');
    const reciterModalClose = document.getElementById('reciter-modal-close');
    const reciterModalTitle = document.getElementById('reciter-modal-title');
    const reciterList = document.getElementById('reciter-list');




    canvasCtx = canvas.getContext('2d');




    // Normalize a keydown event across old/new TV remote firmwares.
    // Old WebKit/Tizen/WebOS browsers often don't populate `key` correctly
    // and only report legacy `keyCode` values (40=Down, 38=Up, 37=Left,
    // 39=Right, 13=Enter, 27/10009/461=Back).
    function normalizeDirection(e) {
      const key = e.key;
      const code = e.keyCode || e.which;
      if (key === 'ArrowDown' || code === 40) return 'down';
      if (key === 'ArrowUp' || code === 38) return 'up';
      if (key === 'ArrowLeft' || code === 37) return 'left';
      if (key === 'ArrowRight' || code === 39) return 'right';
      if (key === 'Enter' || key === ' ' || code === 13 || code === 32) return 'enter';
      if (key === 'Escape' || key === 'Back' || code === 27 || code === 10009 || code === 461) return 'back';
      return null;
    }




    async function init() {
      setupTouchUnlock();
      await fetchSurahs();
      setupEventListeners();
      setupTVNavigation();
      buildReciterList();
      updateReciterTriggerText();
    }




    function setupTouchUnlock() {
      const unlockHandler = () => {
        initAudioContext();
        window.removeEventListener('touchstart', unlockHandler);
        window.removeEventListener('click', unlockHandler);
        window.removeEventListener('keydown', unlockHandler);
      };
      window.addEventListener('touchstart', unlockHandler, { once: true });
      window.addEventListener('click', unlockHandler, { once: true });
      window.addEventListener('keydown', unlockHandler, { once: true });
    }




    function initAudioContext() {
      if (isAudioInitialized) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }




      if (window.location.protocol !== 'file:') {
        audio.setAttribute('crossorigin', 'anonymous');
      }




      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          drawSpectrum();
        }
      } catch (e) {
        console.warn("AudioContext restriction under current environment.");
      }
      isAudioInitialized = true;
    }




    function drawSpectrum() {
      requestAnimationFrame(drawSpectrum);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);




      if (!analyser) return;




      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);




      const barWidth = (canvas.width / bufferLength) * 1.5;
      let x = 0;




      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const color = getComputedStyle(document.documentElement).getPropertyValue('--lcd-text').trim();




        canvasCtx.fillStyle = color;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }
    }




    async function fetchSurahs() {
      try {
        const res = await fetch('https://api.alquran.cloud/v1/surah');
        const data = await res.json();
        surahs = data.data;
        renderPlaylist();
        await loadSurah(0, false);
      } catch (err) {
        lcdTitle.textContent = i18n[currentLang].error;
      }
    }




    function renderPlaylist() {
      playlistEl.innerHTML = '';
      surahs.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${i === currentSurahIndex ? 'active' : ''}`;
        item.setAttribute('tabindex', '0');
        const name = currentLang === 'fr' ? `${s.number}. ${s.englishName}` : `${s.number}. ${s.name}`;
        item.innerHTML = `<span>${name}</span><span>${s.numberOfAyahs} v</span>`;
        
        const selectHandler = () => loadSurah(i, true);
        item.addEventListener('click', selectHandler);
        item.addEventListener('keydown', (e) => {
          const dir = normalizeDirection(e);
          if (dir === 'enter') {
            e.preventDefault();
            selectHandler();
          }
        });
        playlistEl.appendChild(item);
      });
    }




    // D-Pad Up/Down navigation between playlist items (was missing entirely
    // before — TV browsers were relying on unreliable built-in spatial nav).
    playlistEl.addEventListener('keydown', (e) => {
      const dir = normalizeDirection(e);
      if (dir !== 'down' && dir !== 'up') return;


      e.preventDefault();
      e.stopPropagation();


      if (isScrollThrottled) return;
      isScrollThrottled = true;
      setTimeout(() => { isScrollThrottled = false; }, 60);


      const items = Array.from(playlistEl.querySelectorAll('.playlist-item'));
      const currentIndex = items.indexOf(document.activeElement);
      let targetIndex;
      if (dir === 'down') {
        targetIndex = currentIndex < 0 ? 0 : Math.min(currentIndex + 1, items.length - 1);
      } else {
        targetIndex = currentIndex < 0 ? 0 : Math.max(currentIndex - 1, 0);
      }
      const target = items[targetIndex];
      if (target) {
        target.focus();
        target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });




    function scrollPlaylistToActive() {
      const activeItem = playlistEl.querySelector('.playlist-item.active');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }




    function pad3(num) {
      return String(num).padStart(3, '0');
    }




    async function loadSurah(index, autoPlay = true) {
      currentSurahIndex = index;
      const surah = surahs[index];




      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      scrollPlaylistToActive();




      lcdTitle.textContent = `${i18n[currentLang].loading} ${surah.englishName}`;




      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/editions/quran-uthmani,fr.hamidullah`);
        const data = await res.json();




        currentAyahsAr = data.data[0].ayahs;
        currentAyahsFr = data.data[1].ayahs;




        playAyah(0, autoPlay);
      } catch (err) {
        lcdTitle.textContent = i18n[currentLang].error;
      }
    }




    function playAyah(index, autoPlay = true) {
      if (!currentAyahsAr || index >= currentAyahsAr.length) return;




      currentAyahIndex = index;
      const surahNum = surahs[currentSurahIndex].number;
      const ayahAr = currentAyahsAr[index];
      const ayahFr = currentAyahsFr[index];




      isBasmalahPlaying = false;




      let displayAr = ayahAr.text;
      let displayFr = ayahFr.text;




      // Basmalah injection (Exclude Surah 1 & 9)
      if (index === 0 && surahNum !== 1 && surahNum !== 9) {
        const bismillahAr = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n\n";
        const bismillahFr = "Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux\n\n";
        displayAr = bismillahAr + displayAr;
        displayFr = bismillahFr + displayFr;
      }




      arTextEl.textContent = displayAr;
      frTextEl.textContent = displayFr;
      textContainer.scrollTop = 0;




      const reciter = reciterSelect.value;
      const formattedSurah = pad3(surahNum);
      const formattedAyah = pad3(index + 1);




      if (index === 0 && surahNum !== 1 && surahNum !== 9) {
        isBasmalahPlaying = true;
        audio.src = `https://everyayah.com/data/${reciter}/001001.mp3`;
      } else {
        audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}${formattedAyah}.mp3`;
      }




      audio.load();




      const surahName = currentLang === 'fr' ? surahs[currentSurahIndex].englishName : surahs[currentSurahIndex].name;
      lcdTitle.textContent = `${surahName} - ${i18n[currentLang].ayah} ${index + 1}/${currentAyahsAr.length}`;




      if (autoPlay) {
        initAudioContext();
        let promise = audio.play();
        if (promise !== undefined) {
          promise.catch(e => console.log("User interaction required."));
        }
      }
    }




    // --- Custom Reciter Picker (fixes: white popup in dark mode, and
    // unreliable TV spatial-nav focus around the native <select>) ---
    function buildReciterList() {
      reciterList.innerHTML = '';
      const options = Array.from(reciterSelect.options);
      options.forEach((opt, index) => {
        const li = document.createElement('li');
        li.className = 'reciter-item';
        li.setAttribute('tabindex', '0');
        if (reciterSelect.selectedIndex === index) li.classList.add('selected');
        li.textContent = opt.text;
        li.addEventListener('click', () => selectReciter(index));
        reciterList.appendChild(li);
      });
    }


    function selectReciter(index) {
      reciterSelect.selectedIndex = index;
      updateReciterTriggerText();
      reciterModal.classList.add('hidden');
      reciterTrigger.focus();
      buildReciterList();
      reciterSelect.dispatchEvent(new Event('change'));
    }


    function updateReciterTriggerText() {
      const idx = reciterSelect.selectedIndex;
      reciterTriggerText.textContent = reciterSelect.options[idx] ? reciterSelect.options[idx].text : '';
    }


    function openReciterModal() {
      reciterModalTitle.textContent = i18n[currentLang].reciter;
      reciterModal.classList.remove('hidden');
      const items = reciterList.querySelectorAll('.reciter-item');
      const selected = reciterList.querySelector('.selected') || items[0];
      if (selected) {
        selected.focus();
        selected.scrollIntoView({ block: 'center' });
      }
    }


    function closeReciterModal() {
      reciterModal.classList.add('hidden');
      reciterTrigger.focus();
    }


    reciterTrigger.addEventListener('click', openReciterModal);
    reciterModalClose.addEventListener('click', closeReciterModal);
    reciterModal.addEventListener('click', (e) => {
      if (e.target === reciterModal) closeReciterModal();
    });


    reciterList.addEventListener('keydown', (e) => {
      const items = Array.from(reciterList.querySelectorAll('.reciter-item'));
      const currentIndex = items.indexOf(document.activeElement);
      const dir = normalizeDirection(e);


      if (dir === 'down' || dir === 'up') {
        e.preventDefault();
        e.stopPropagation();


        if (isScrollThrottled) return;
        isScrollThrottled = true;
        setTimeout(() => { isScrollThrottled = false; }, 60);


        let targetIndex;
        if (dir === 'down') {
          targetIndex = Math.min(currentIndex + 1, items.length - 1);
        } else {
          targetIndex = Math.max(currentIndex - 1, 0);
        }
        const target = items[targetIndex];
        target.focus();
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (dir === 'enter') {
        e.preventDefault();
        e.stopPropagation();
        if (document.activeElement && document.activeElement.classList.contains('reciter-item')) {
          document.activeElement.click();
        }
      } else if (dir === 'back') {
        e.preventDefault();
        e.stopPropagation();
        closeReciterModal();
      }
    });




    function setupTVNavigation() {
      // Global D-Pad listener for older TV remotes
      window.addEventListener('keydown', (e) => {
        // Let the reciter modal's own handler own Up/Down/Enter/Back while open
        if (!reciterModal.classList.contains('hidden')) return;
        if (document.activeElement && document.activeElement.classList.contains('reciter-item')) return;
        if (document.activeElement && document.activeElement.classList.contains('playlist-item')) return;


        const dir = normalizeDirection(e);
        const active = document.activeElement;


        // Trigger click on 'OK' key on remote
        if (dir === 'enter') {
          if (active && active.tagName !== 'BODY') {
            active.click();
          }
        }


        // Direct Seek / Volume adjustment with Left / Right D-Pad keys
        if (active && active.tagName === 'INPUT' && active.type === 'range') {
          if (dir === 'left') {
            active.value = Math.max(0, parseInt(active.value) - 5);
            active.dispatchEvent(new Event('input'));
          }
          if (dir === 'right') {
            active.value = Math.min(100, parseInt(active.value) + 5);
            active.dispatchEvent(new Event('input'));
          }
        }
      });


      // Scroll containers when D-Pad arrows are pressed on focused containers
      textContainer.addEventListener('keydown', (e) => {
        const dir = normalizeDirection(e);
        if (dir === 'up') { textContainer.scrollTop -= 60; e.preventDefault(); }
        if (dir === 'down') { textContainer.scrollTop += 60; e.preventDefault(); }
      });
    }




    function setupEventListeners() {
      playBtn.addEventListener('click', () => {
        initAudioContext();
        audio.play();
      });




      pauseBtn.addEventListener('click', () => audio.pause());
      
      stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
      });




      prevBtn.addEventListener('click', () => {
        if (currentAyahIndex > 0) playAyah(currentAyahIndex - 1, true);
        else if (currentSurahIndex > 0) loadSurah(currentSurahIndex - 1, true);
      });




      nextBtn.addEventListener('click', () => {
        if (currentAyahIndex < currentAyahsAr.length - 1) playAyah(currentAyahIndex + 1, true);
        else if (currentSurahIndex < surahs.length - 1) loadSurah(currentSurahIndex + 1, true);
      });




      audio.addEventListener('ended', () => {
        if (isBasmalahPlaying) {
          isBasmalahPlaying = false;
          const reciter = reciterSelect.value;
          const formattedSurah = pad3(surahs[currentSurahIndex].number);
          audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}001.mp3`;
          audio.load();
          audio.play();
          return;
        }




        if (currentAyahIndex < currentAyahsAr.length - 1) {
          playAyah(currentAyahIndex + 1, true);
        } else if (currentSurahIndex < surahs.length - 1) {
          loadSurah(currentSurahIndex + 1, true);
        }
      });




      audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
          seekBar.value = (audio.currentTime / audio.duration) * 100;
          const mins = Math.floor(audio.currentTime / 60).toString().padStart(2, '0');
          const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
          lcdTime.textContent = `${mins}:${secs}`;
        }
      });




      seekBar.addEventListener('input', () => {
        if (!isNaN(audio.duration)) {
          audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
      });




      volumeBar.addEventListener('input', () => {
        audio.volume = volumeBar.value / 100;
      });




      reciterSelect.addEventListener('change', () => playAyah(currentAyahIndex, true));




      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });




      langBtn.addEventListener('click', () => {
        currentLang = currentLang === 'fr' ? 'ar' : 'fr';
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        langBtn.textContent = currentLang === 'fr' ? 'AR' : 'FR';
        appTitleEl.textContent = i18n[currentLang].title;
        renderPlaylist();
        if (currentAyahsAr.length > 0) playAyah(currentAyahIndex, !audio.paused);
      });
    }




    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
