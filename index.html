<!DOCTYPE html>
<html lang="fr" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winamp Quran Player - TV Gold Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=VT323&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg-color: #120e0b;
      --chassis-bg: linear-gradient(145deg, #322319, #1c130d);
      --chassis-border: #7a5c32;
      --lcd-bg: #0b0904;
      --lcd-text: #ffd700;
      --lcd-glow: rgba(255, 215, 0, 0.25);
      --btn-bg: linear-gradient(180deg, #4d3826 0%, #2b1d12 100%);
      --btn-border: #96733e;
      --btn-text: #f5e6c8;
      --btn-active: #ffe600;
      --text-main: #f5e6c8;
      --panel-bg: #1a120b;
      --accent: #d4af37;
      --gold-gradient: linear-gradient(90deg, #7a5c32, #d4af37, #7a5c32);
      --focus-ring: #ffe600;
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }


    [data-theme="light"] {
      --bg-color: #f4efe6;
      --chassis-bg: linear-gradient(145deg, #e8dfd1, #cdbfab);
      --chassis-border: #a88448;
      --lcd-bg: #2a2010;
      --lcd-text: #ffcc00;
      --lcd-glow: rgba(255, 204, 0, 0.3);
      --btn-bg: linear-gradient(180deg, #ffffff 0%, #dfd3c3 100%);
      --btn-border: #b8975a;
      --btn-text: #3d2b1f;
      --btn-active: #d4af37;
      --text-main: #3d2b1f;
      --panel-bg: #e2d7c7;
      --accent: #966f2d;
      --gold-gradient: linear-gradient(90deg, #b8975a, #f3e5ab, #b8975a);
      --focus-ring: #d4af37;
      --modal-overlay: rgba(0, 0, 0, 0.65);
    }


    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.3s, color 0.3s;
    }


    /* TV Responsive Winamp Container */
    .winamp-container {
      width: 100%;
      max-width: min(94vw, 680px);
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 10px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85), inset 1px 1px 0 rgba(255,230,150,0.25);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }


    /* High contrast TV Focus Indicators */
    :focus, :focus-visible {
      outline: 3px solid var(--focus-ring) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 16px var(--focus-ring) !important;
    }


    /* Title Bar */
    .title-bar {
      background: var(--gold-gradient);
      color: #120e0b;
      font-size: 15px;
      font-weight: bold;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
      letter-spacing: 1px;
    }


    .title-bar-controls { display: flex; gap: 8px; }
    
    .win-btn {
      min-width: 36px; height: 30px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      font-size: 13px; line-height: 28px; text-align: center; 
      color: var(--btn-text); cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      padding: 0 8px;
    }


    /* LCD Screen */
    .lcd-screen {
      background-color: var(--lcd-bg);
      border: 2px inset var(--chassis-border);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: inset 0 0 12px var(--lcd-glow);
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
    }


    .lcd-info { overflow: hidden; }
    
    .lcd-ticker {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 24px;
      white-space: nowrap;
      text-shadow: 0 0 6px var(--lcd-text);
      animation: ticker 12s linear infinite;
      display: inline-block;
    }


    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }


    [dir="rtl"] .lcd-ticker {
      animation: ticker-rtl 12s linear infinite;
    }


    @keyframes ticker-rtl {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }


    .lcd-timer {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 28px;
      text-shadow: 0 0 6px var(--lcd-text);
      margin-top: 2px;
    }


    canvas#spectrum {
      width: 120px;
      height: 48px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--chassis-border);
      border-radius: 3px;
    }


    /* Controls Panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    /* Reciter Selector Trigger Button */
    .reciter-trigger-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }


    .reciter-trigger-btn::after {
      content: '▼';
      font-size: 12px;
      color: var(--accent);
    }


    /* Redesigned Beautiful Metallic Transport Buttons */
    .transport-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }


    .btn-winamp {
      flex: 1;
      height: 48px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.4);
      transition: all 0.15s ease;
    }


    .btn-winamp svg {
      width: 22px;
      height: 22px;
      fill: var(--accent);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
      transition: transform 0.1s ease, fill 0.15s ease;
    }


    .btn-winamp:hover svg, .btn-winamp:focus svg {
      fill: #ffffff;
      transform: scale(1.1);
    }


    .btn-winamp:active {
      transform: translateY(2px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    }


    .sliders {
      display: flex;
      gap: 14px;
      align-items: center;
    }


    input[type=range] {
      -webkit-appearance: none;
      background: #000;
      height: 12px;
      border-radius: 6px;
      border: 1px solid var(--chassis-border);
    }


    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 22px;
      background: var(--accent);
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
    }


    .seek-bar { flex: 2; }
    .volume-bar { flex: 1; }


    /* Playlist Window with Smooth Scroll Logic */
    .playlist-window {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      height: 160px;
      overflow-y: auto;
      font-size: 16px;
      border-radius: 6px;
      scroll-behavior: smooth;
    }


    .playlist-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }


    .playlist-item:hover, .playlist-item:focus {
      background: rgba(212, 175, 55, 0.25);
    }
    
    .playlist-item.active {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    /* Quran Text Display Window (Arabic Only, Resized) */
    .quran-text-container {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      padding: 14px;
      min-height: 120px;
      max-height: 180px;
      overflow-y: auto;
      text-align: center;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-behavior: smooth;
    }


    .ar-text {
      font-family: 'Amiri', serif;
      font-size: clamp(20px, 2.8vw, 30px);
      color: var(--accent);
      direction: rtl;
      line-height: 1.6;
      font-weight: bold;
      white-space: pre-line;
      width: 100%;
    }


    /* Custom Dark Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }


    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }


    .modal-card {
      background: var(--panel-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      overflow: hidden;
    }


    .modal-header {
      background: var(--gold-gradient);
      color: #120e0b;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #120e0b;
      cursor: pointer;
    }


    .modal-list {
      overflow-y: auto;
      padding: 6px 0;
      max-height: 60vh;
    }


    .reciter-option {
      padding: 12px 18px;
      font-size: 16px;
      color: var(--text-main);
      cursor: pointer;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .reciter-option:hover, .reciter-option:focus {
      background: rgba(212, 175, 55, 0.25);
    }


    .reciter-option.selected {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--chassis-border); border-radius: 4px; }
  </style>
</head>
<body>


  <div class="winamp-container" id="app-container">
    <div class="title-bar">
      <span id="app-title">WINAMP - LECTEUR CORAN</span>
      <div class="title-bar-controls">
        <button class="win-btn" id="btn-lang" tabindex="0">AR</button>
        <button class="win-btn" id="btn-theme" tabindex="0">☀</button>
      </div>
    </div>


    <div class="lcd-screen">
      <div class="lcd-info">
        <div class="lcd-ticker" id="lcd-title">Appuyez sur PLAY pour démarrer</div>
        <div class="lcd-timer" id="lcd-time">00:00</div>
      </div>
      <canvas id="spectrum" width="120" height="48"></canvas>
    </div>


    <div class="controls-panel">
      <!-- Reciter Modal Button -->
      <button class="reciter-trigger-btn" id="reciter-btn" tabindex="0">
        <span id="reciter-label">Mishary Rashid Alafasy</span>
      </button>


      <!-- Beautiful SVG Transport Buttons -->
      <div class="transport-buttons">
        <button class="btn-winamp" id="btn-prev" tabindex="0" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-play" tabindex="0" title="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-pause" tabindex="0" title="Pause">
          <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-stop" tabindex="0" title="Stop">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-next" tabindex="0" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>


      <div class="sliders">
        <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" tabindex="0">
        <input type="range" id="volume-bar" class="volume-bar" value="80" min="0" max="100" tabindex="0">
      </div>
    </div>


    <div class="playlist-window" id="playlist"></div>


    <div class="quran-text-container" id="text-container" tabindex="0">
      <div class="ar-text" id="ar-text">اخْتَر سُورَة لِلْبَدْء</div>
    </div>
  </div>


  <!-- Reciter Modal -->
  <div class="modal-overlay" id="reciter-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modal-title">Choisir un Récitateur</span>
        <button class="modal-close-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-list" id="reciter-list"></div>
    </div>
  </div>


  <audio id="audio-player" playsinline></audio>


  <script>
    const RECITERS = [
      { id: "Alafasy_128kbps", name: "Mishary Rashid Alafasy" },
      { id: "Abdurrahmaan_As-Sudais_192kbps", name: "Abdul Rahman Al-Sudais" },
      { id: "Ghamadi_40kbps", name: "Saad Al-Ghamdi" },
      { id: "MaherAlMuaiqly128kbps", name: "Maher Al-Muaiqly" },
      { id: "Abdul_Basit_Murattal_192kbps", name: "Abdul Basit Abdul Samad" },
      { id: "Abu_Bakr_Ash-Shaatree_128kbps", name: "Abu Bakr Al-Shatri" },
      { id: "Husary_128kbps", name: "Mahmoud Khalil Al-Husary" },
      { id: "Yasser_Ad-Dussary_128kbps", name: "Yasser Al-Dosari" },
      { id: "Saood bin Ibraaheem Ash-Shuraym_128kbps", name: "Saud Al-Shuraim" },
      { id: "Nasser_Alqatami_128kbps", name: "Nasser Al-Qatami" }
    ];


    let selectedReciterId = "Alafasy_128kbps";
    let surahs = [];
    let currentSurahIndex = 0;
    let currentAyahIndex = 0;
    let currentAyahsAr = [];
    let currentLang = 'fr';
    let audioCtx, analyser, source, canvasCtx;
    let isAudioInitialized = false;
    let isBasmalahPlaying = false;


    const i18n = {
      fr: { title: "WINAMP - LECTEUR CORAN", loading: "Chargement...", ayah: "Verset", error: "Erreur de connexion", reciterModalTitle: "Choisir un Récitateur" },
      ar: { title: "ويناتمب - مشغل القرآن الكريم", loading: "جاري التحميل...", ayah: "الآية", error: "خطأ في الاتصال", reciterModalTitle: "اختر القارئ" }
    };


    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const lcdTitle = document.getElementById('lcd-title');
    const lcdTime = document.getElementById('lcd-time');
    const playlistEl = document.getElementById('playlist');
    const themeBtn = document.getElementById('btn-theme');
    const langBtn = document.getElementById('btn-lang');
    const arTextEl = document.getElementById('ar-text');
    const textContainer = document.getElementById('text-container');
    const appTitleEl = document.getElementById('app-title');
    const canvas = document.getElementById('spectrum');


    const reciterBtn = document.getElementById('reciter-btn');
    const reciterLabel = document.getElementById('reciter-label');
    const reciterModal = document.getElementById('reciter-modal');
    const reciterList = document.getElementById('reciter-list');
    const modalCloseBtn = document.getElementById('modal-close');
    const modalTitleEl = document.getElementById('modal-title');


    canvasCtx = canvas.getContext('2d');


    async function init() {
      setupTouchUnlock();
      renderReciterList();
      await fetchSurahs();
      setupEventListeners();
      setupTVNavigation();
    }


    function setupTouchUnlock() {
      const unlockHandler = () => {
        initAudioContext();
        window.removeEventListener('touchstart', unlockHandler);
        window.removeEventListener('click', unlockHandler);
        window.removeEventListener('keydown', unlockHandler);
      };
      window.addEventListener('touchstart', unlockHandler, { once: true });
      window.addEventListener('click', unlockHandler, { once: true });
      window.addEventListener('keydown', unlockHandler, { once: true });
    }


    function initAudioContext() {
      if (isAudioInitialized) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }


      if (window.location.protocol !== 'file:') {
        audio.setAttribute('crossorigin', 'anonymous');
      }


      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          drawSpectrum();
        }
      } catch (e) {
        console.warn("AudioContext restriction under current environment.");
      }
      isAudioInitialized = true;
    }


    function drawSpectrum() {
      requestAnimationFrame(drawSpectrum);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);


      if (!analyser) return;


      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);


      const barWidth = (canvas.width / bufferLength) * 1.5;
      let x = 0;


      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const color = getComputedStyle(document.documentElement).getPropertyValue('--lcd-text').trim();


        canvasCtx.fillStyle = color;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }
    }


    function renderReciterList() {
      reciterList.innerHTML = '';
      RECITERS.forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = `reciter-option ${r.id === selectedReciterId ? 'selected' : ''}`;
        item.setAttribute('tabindex', '0');
        item.setAttribute('data-id', r.id);
        item.innerHTML = `<span>${r.name}</span>${r.id === selectedReciterId ? '<span>✓</span>' : ''}`;


        const selectHandler = () => {
          selectedReciterId = r.id;
          reciterLabel.textContent = r.name;
          closeReciterModal();
          playAyah(currentAyahIndex, true);
        };


        item.addEventListener('click', selectHandler);
        item.addEventListener('focus', () => item.scrollIntoView({ block: 'nearest' }));
        reciterList.appendChild(item);
      });
    }


    function openReciterModal() {
      modalTitleEl.textContent = i18n[currentLang].reciterModalTitle;
      reciterModal.classList.add('open');
      const selectedItem = reciterList.querySelector('.reciter-option.selected') || reciterList.firstElementChild;
      if (selectedItem) selectedItem.focus();
    }


    function closeReciterModal() {
      reciterModal.classList.remove('open');
      reciterBtn.focus();
    }


    async function fetchSurahs() {
      try {
        const res = await fetch('https://api.alquran.cloud/v1/surah');
        const data = await res.json();
        surahs = data.data;
        renderPlaylist();
        await loadSurah(0, false);
      } catch (err) {
        lcdTitle.textContent = i18n[currentLang].error;
      }
    }


    function renderPlaylist() {
      playlistEl.innerHTML = '';
      surahs.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${i === currentSurahIndex ? 'active' : ''}`;
        item.setAttribute('tabindex', '0');
        item.setAttribute('data-index', i);
        const name = currentLang === 'fr' ? `${s.number}. ${s.englishName}` : `${s.number}. ${s.name}`;
        item.innerHTML = `<span>${name}</span><span>v ${s.numberOfAyahs}</span>`;
        
        const selectHandler = () => loadSurah(i, true);
        item.addEventListener('click', selectHandler);
        
        // Auto-scroll playlist item into view on focus
        item.addEventListener('focus', () => {
          item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });


        playlistEl.appendChild(item);
      });
    }


    function scrollPlaylistToActive() {
      const activeItem = playlistEl.querySelector('.playlist-item.active');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }


    function pad3(num) {
      return String(num).padStart(3, '0');
    }


    async function loadSurah(index, autoPlay = true) {
      currentSurahIndex = index;
      const surah = surahs[index];


      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      scrollPlaylistToActive();


      lcdTitle.textContent = `${i18n[currentLang].loading} ${surah.englishName}`;


      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/editions/quran-uthmani`);
        const data = await res.json();


        currentAyahsAr = data.data[0].ayahs;
        playAyah(0, autoPlay);
      } catch (err) {
        lcdTitle.textContent = i18n[currentLang].error;
      }
    }


    function playAyah(index, autoPlay = true) {
      if (!currentAyahsAr || index >= currentAyahsAr.length) return;


      currentAyahIndex = index;
      const surahNum = surahs[currentSurahIndex].number;
      const ayahAr = currentAyahsAr[index];


      isBasmalahPlaying = false;


      let displayAr = ayahAr.text;


      // Basmalah injection (Exclude Surah 1 & 9)
      if (index === 0 && surahNum !== 1 && surahNum !== 9) {
        const bismillahAr = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n\n";
        displayAr = bismillahAr + displayAr;
      }


      arTextEl.textContent = displayAr;
      textContainer.scrollTop = 0;


      const reciter = selectedReciterId;
      const formattedSurah = pad3(surahNum);
      const formattedAyah = pad3(index + 1);


      if (index === 0 && surahNum !== 1 && surahNum !== 9) {
        isBasmalahPlaying = true;
        audio.src = `https://everyayah.com/data/${reciter}/001001.mp3`;
      } else {
        audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}${formattedAyah}.mp3`;
      }


      audio.load();


      const surahName = currentLang === 'fr' ? surahs[currentSurahIndex].englishName : surahs[currentSurahIndex].name;
      lcdTitle.textContent = `${surahName} - ${i18n[currentLang].ayah} ${index + 1}/${currentAyahsAr.length}`;


      if (autoPlay) {
        initAudioContext();
        let promise = audio.play();
        if (promise !== undefined) {
          promise.catch(e => console.log("User interaction required."));
        }
      }
    }


    /* Unified TV Remote Navigation */
    function setupTVNavigation() {
      window.addEventListener('keydown', (e) => {
        const key = e.key || e.keyCode;
        const active = document.activeElement;


        // Unified OK/Enter trigger
        if (key === 'Enter' || key === 13 || key === 'OK' || key === 'Select') {
          if (active && active !== document.body) {
            e.preventDefault();
            active.click();
          }
          return;
        }


        // Modal Navigation Trap
        if (reciterModal.classList.contains('open')) {
          const options = Array.from(reciterList.querySelectorAll('.reciter-option'));
          const curIndex = options.indexOf(active);


          if (key === 'ArrowUp' || key === 38) {
            e.preventDefault();
            if (curIndex > 0) {
              options[curIndex - 1].focus();
              options[curIndex - 1].scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'ArrowDown' || key === 40) {
            e.preventDefault();
            if (curIndex < options.length - 1) {
              options[curIndex + 1].focus();
              options[curIndex + 1].scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'Back' || key === 'Escape' || key === 27) {
            e.preventDefault();
            closeReciterModal();
          }
          return;
        }


        // Playlist D-Pad Navigation with Scroll-Into-View (Fixes Bug 1)
        if (active && active.classList.contains('playlist-item')) {
          const items = Array.from(playlistEl.querySelectorAll('.playlist-item'));
          const curIndex = items.indexOf(active);


          if (key === 'ArrowUp' || key === 38) {
            e.preventDefault();
            if (curIndex > 0) {
              const prev = items[curIndex - 1];
              prev.focus();
              prev.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
              reciterBtn.focus();
            }
          } else if (key === 'ArrowDown' || key === 40) {
            e.preventDefault();
            if (curIndex < items.length - 1) {
              const next = items[curIndex + 1];
              next.focus();
              next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
              textContainer.focus();
            }
          }
          return;
        }


        // Sliders D-Pad Left/Right Adjustment
        if (active && active.tagName === 'INPUT' && active.type === 'range') {
          if (key === 'ArrowLeft' || key === 37) {
            e.preventDefault();
            active.value = Math.max(0, parseInt(active.value) - 5);
            active.dispatchEvent(new Event('input'));
          } else if (key === 'ArrowRight' || key === 39) {
            e.preventDefault();
            active.value = Math.min(100, parseInt(active.value) + 5);
            active.dispatchEvent(new Event('input'));
          }
        }
      });


      // D-Pad Scroll Quran Text Container
      textContainer.addEventListener('keydown', (e) => {
        const key = e.key || e.keyCode;
        if (key === 'ArrowUp' || key === 38) {
          textContainer.scrollTop -= 50;
          e.preventDefault();
        } else if (key === 'ArrowDown' || key === 40) {
          textContainer.scrollTop += 50;
          e.preventDefault();
        }
      });
    }


    function setupEventListeners() {
      reciterBtn.addEventListener('click', openReciterModal);
      modalCloseBtn.addEventListener('click', closeReciterModal);
      reciterModal.addEventListener('click', (e) => {
        if (e.target === reciterModal) closeReciterModal();
      });


      playBtn.addEventListener('click', () => {
        initAudioContext();
        audio.play();
      });


      pauseBtn.addEventListener('click', () => audio.pause());
      
      stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
      });


      prevBtn.addEventListener('click', () => {
        if (currentAyahIndex > 0) playAyah(currentAyahIndex - 1, true);
        else if (currentSurahIndex > 0) loadSurah(currentSurahIndex - 1, true);
      });


      nextBtn.addEventListener('click', () => {
        if (currentAyahIndex < currentAyahsAr.length - 1) playAyah(currentAyahIndex + 1, true);
        else if (currentSurahIndex < surahs.length - 1) loadSurah(currentSurahIndex + 1, true);
      });


      audio.addEventListener('ended', () => {
        if (isBasmalahPlaying) {
          isBasmalahPlaying = false;
          const reciter = selectedReciterId;
          const formattedSurah = pad3(surahs[currentSurahIndex].number);
          audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}001.mp3`;
          audio.load();
          audio.play();
          return;
        }


        if (currentAyahIndex < currentAyahsAr.length - 1) {
          playAyah(currentAyahIndex + 1, true);
        } else if (currentSurahIndex < surahs.length - 1) {
          loadSurah(currentSurahIndex + 1, true);
        }
      });


      audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
          seekBar.value = (audio.currentTime / audio.duration) * 100;
          const mins = Math.floor(audio.currentTime / 60).toString().padStart(2, '0');
          const secs = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
          lcdTime.textContent = `${mins}:${secs}`;
        }
      });


      seekBar.addEventListener('input', () => {
        if (!isNaN(audio.duration)) {
          audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
      });


      volumeBar.addEventListener('input', () => {
        audio.volume = volumeBar.value / 100;
      });


      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });


      langBtn.addEventListener('click', () => {
        currentLang = currentLang === 'fr' ? 'ar' : 'fr';
        document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        langBtn.textContent = currentLang === 'fr' ? 'AR' : 'FR';
        appTitleEl.textContent = i18n[currentLang].title;
        renderPlaylist();
        renderReciterList();
        if (currentAyahsAr.length > 0) playAyah(currentAyahIndex, !audio.paused);
      });
    }


    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
