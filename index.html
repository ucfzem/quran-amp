<!DOCTYPE html>
<html lang="ar" data-theme="dark" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winamp Quran Player - TV Gold Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=VT323&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg-color: #120e0b;
      --chassis-bg: linear-gradient(145deg, #322319, #1c130d);
      --chassis-border: #7a5c32;
      --lcd-bg: #0b0904;
      --lcd-text: #ffd700;
      --lcd-glow: rgba(255, 215, 0, 0.25);
      --btn-bg: linear-gradient(180deg, #4d3826 0%, #2b1d12 100%);
      --btn-border: #96733e;
      --btn-text: #f5e6c8;
      --text-main: #f5e6c8;
      --panel-bg: #1a120b;
      --accent: #d4af37;
      --gold-gradient: linear-gradient(90deg, #7a5c32, #d4af37, #7a5c32);
      --focus-ring: #ffe600;
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }


    [data-theme="light"] {
      --bg-color: #f4efe6;
      --chassis-bg: linear-gradient(145deg, #e8dfd1, #cdbfab);
      --chassis-border: #a88448;
      --lcd-bg: #2a2010;
      --lcd-text: #ffcc00;
      --lcd-glow: rgba(255, 204, 0, 0.3);
      --btn-bg: linear-gradient(180deg, #ffffff 0%, #dfd3c3 100%);
      --btn-border: #b8975a;
      --btn-text: #3d2b1f;
      --text-main: #3d2b1f;
      --panel-bg: #e2d7c7;
      --accent: #966f2d;
      --gold-gradient: linear-gradient(90deg, #b8975a, #f3e5ab, #b8975a);
      --focus-ring: #d4af37;
      --modal-overlay: rgba(0, 0, 0, 0.65);
    }


    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      transition: background 0.3s, color 0.3s;
    }


    .winamp-container {
      width: 100%;
      max-width: min(94vw, 580px);
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 10px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85), inset 1px 1px 0 rgba(255,230,150,0.25);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }


    :focus, :focus-visible {
      outline: 3px solid var(--focus-ring) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 12px var(--focus-ring) !important;
    }


    .title-bar {
      background: var(--gold-gradient);
      color: #120e0b;
      font-size: 14px;
      font-weight: bold;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
    }


    .title-bar-controls { display: flex; gap: 6px; }
    
    .win-btn {
      min-width: 32px; height: 26px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      font-size: 12px; line-height: 24px; text-align: center; 
      color: var(--btn-text); cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      padding: 0 6px;
    }


    .lcd-screen {
      background-color: var(--lcd-bg);
      border: 2px inset var(--chassis-border);
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: inset 0 0 12px var(--lcd-glow);
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      align-items: center;
    }


    .lcd-info { overflow: hidden; text-align: right; }
    
    .lcd-ticker {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 20px;
      white-space: nowrap;
      text-shadow: 0 0 6px var(--lcd-text);
      animation: ticker-rtl 12s linear infinite;
      display: inline-block;
    }


    @keyframes ticker-rtl {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }


    .lcd-timer {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 24px;
      text-shadow: 0 0 6px var(--lcd-text);
      margin-top: 2px;
    }


    .lcd-ayah-count {
      font-family: 'VT323', monospace;
      color: var(--lcd-text);
      font-size: 15px;
      opacity: 0.85;
      margin-top: 2px;
    }


    canvas#spectrum {
      width: 100px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--chassis-border);
      border-radius: 4px;
      cursor: pointer;
    }


    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }


    .reciter-trigger-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 8px 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Tajawal', sans-serif;
    }


    .reciter-trigger-btn::after {
      content: '▼';
      font-size: 11px;
      color: var(--accent);
    }


    .transport-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }


    .btn-winamp {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      color: var(--btn-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
    }


    .btn-winamp.btn-main {
      width: 50px;
      height: 50px;
    }


    .btn-winamp svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }


    .btn-winamp.btn-main svg {
      width: 22px;
      height: 22px;
    }


    .btn-winamp:hover svg, .btn-winamp:focus svg {
      fill: #ffffff;
    }


    .sliders {
      display: flex;
      gap: 10px;
      align-items: center;
    }


    input[type=range] {
      -webkit-appearance: none;
      background: #000;
      height: 10px;
      border-radius: 5px;
      border: 1px solid var(--chassis-border);
    }


    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 18px;
      background: var(--accent);
      border: 1px solid #fff;
      border-radius: 3px;
      cursor: pointer;
    }


    .seek-bar { flex: 2; }
    .volume-bar { flex: 1; }


    .playlist-window {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      height: 130px;
      overflow-y: auto;
      font-size: 15px;
      border-radius: 6px;
      scroll-behavior: smooth;
    }


    .playlist-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }


    .playlist-item:hover, .playlist-item:focus {
      background: rgba(212, 175, 55, 0.25);
    }
    
    .playlist-item.active {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    .quran-text-container {
      background: var(--panel-bg);
      border: 2px inset var(--chassis-border);
      padding: 12px;
      height: 150px; /* Fixed height to prevent layout jumps */
      overflow-y: auto;
      text-align: center;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-behavior: smooth;
    }


    .ar-text {
      font-family: 'Amiri', serif;
      font-size: 26px; /* Fixed size for consistency */
      color: var(--accent);
      direction: rtl;
      line-height: 1.7;
      font-weight: bold;
      white-space: pre-line;
      width: 100%;
    }


    .ayah-marker {
      color: var(--lcd-text);
      font-size: 0.7em;
      font-weight: normal;
    }


    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }


    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }


    .modal-card {
      background: var(--panel-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }


    .modal-header {
      background: var(--gold-gradient);
      color: #120e0b;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #120e0b;
      cursor: pointer;
    }


    .modal-list {
      overflow-y: auto;
      padding: 6px 0;
      max-height: 60vh;
    }


    .reciter-option {
      padding: 10px 16px;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .reciter-option:hover, .reciter-option:focus {
      background: rgba(212, 175, 55, 0.25);
    }


    .reciter-option.selected {
      background: var(--accent);
      color: #120e0b;
      font-weight: bold;
    }


    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--chassis-border); border-radius: 3px; }
  </style>
</head>
<body>


  <div class="winamp-container" id="app-container">
    <div class="title-bar">
      <span id="app-title">ويناتمب - مشغل القرآن الكريم</span>
      <div class="title-bar-controls">
        <button class="win-btn" id="btn-theme" tabindex="0">☀</button>
      </div>
    </div>


    <div class="lcd-screen">
      <canvas id="spectrum" width="100" height="40" tabindex="0" title="انقر لتغيير النمط"></canvas>
      <div class="lcd-info">
        <div class="lcd-ticker" id="lcd-title">اضغط تشغيل للبدء</div>
        <div class="lcd-timer" id="lcd-time">00:00</div>
        <div class="lcd-ayah-count" id="lcd-ayah-count"></div>
      </div>
    </div>


    <div class="controls-panel">
      <button class="reciter-trigger-btn" id="reciter-btn" tabindex="0">
        <span id="reciter-label">محمود خليل الحصري</span>
      </button>


      <div class="transport-buttons">
        <button class="btn-winamp" id="btn-prev" tabindex="0" title="السابقة">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-stop" tabindex="0" title="إيقاف">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button class="btn-winamp btn-main" id="btn-play" tabindex="0" title="تشغيل">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-pause" tabindex="0" title="إيقاف مؤقت">
          <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-winamp" id="btn-next" tabindex="0" title="التالية">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>


      <div class="sliders">
        <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" step="0.1" tabindex="0">
        <input type="range" id="volume-bar" class="volume-bar" value="80" min="0" max="100" tabindex="0">
      </div>
    </div>


    <div class="playlist-window" id="playlist"></div>


    <div class="quran-text-container" id="text-container" tabindex="0">
      <div class="ar-text" id="ar-text">اخْتَر سُورَة لِلْبَدْء</div>
    </div>
  </div>


  <div class="modal-overlay" id="reciter-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span>اختر القارئ</span>
        <button class="modal-close-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-list" id="reciter-list"></div>
    </div>
  </div>


  <audio id="audio-player" playsinline></audio>


  <script>
    const RECITERS = [
      { id: "Husary_128kbps", name: "محمود خليل الحصري" },
      { id: "Alafasy_128kbps", name: "مشاري راشد العفاسي" },
      { id: "Abdurrahmaan_As-Sudais_192kbps", name: "عبد الرحمن السديس" },
      { id: "Ghamadi_40kbps", name: "سعد الغامدي" },
      { id: "MaherAlMuaiqly128kbps", name: "ماهر المعيقلي" },
      { id: "Abdul_Basit_Murattal_192kbps", name: "عبد الباسط عبد الصمد" },
      { id: "Saood bin Ibraaheem Ash-Shuraym_128kbps", name: "سعود الشريم" },
      { id: "Abu_Bakr_Ash-Shaatree_128kbps", name: "أبو بكر الشاطري" },
      { id: "Yasser_Ad-Dussary_128kbps", name: "ياسر الدوسري" },
      { id: "Nasser_Alqatami_128kbps", name: "ناصر القطامي" },
      { id: "Muhammad_Jibreel_128kbps", name: "محمد جبريل" },
      { id: "Mustafa_Ismail_48kbps", name: "مصطفى إسماعيل" },
      { id: "Minshawy_Murattal_128kbps", name: "محمد صديق المنشاوي" },
      { id: "Khaalid_Abdullaah_al-Qahtaanee_192kbps", name: "خالد القحطاني" }
    ];


    let selectedReciterId = "Husary_128kbps";
    let surahs = [];
    let currentSurahIndex = 0;
    let currentAyahIndex = 0;
    let currentAyahsAr = [];
    let audioCtx, analyser, source, canvasCtx;
    let isAudioInitialized = false;
    let isBasmalahPlaying = false;
    let vizMode = 0;


    // Variables for continuous timer
    let totalElapsedBeforeCurrentAyah = 0;


    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const lcdTitle = document.getElementById('lcd-title');
    const lcdTime = document.getElementById('lcd-time');
    const lcdAyahCount = document.getElementById('lcd-ayah-count');
    const playlistEl = document.getElementById('playlist');
    const themeBtn = document.getElementById('btn-theme');
    const arTextEl = document.getElementById('ar-text');
    const textContainer = document.getElementById('text-container');
    const canvas = document.getElementById('spectrum');


    const reciterBtn = document.getElementById('reciter-btn');
    const reciterLabel = document.getElementById('reciter-label');
    const reciterModal = document.getElementById('reciter-modal');
    const reciterList = document.getElementById('reciter-list');
    const modalCloseBtn = document.getElementById('modal-close');


    canvasCtx = canvas.getContext('2d');


    const ARABIC_INDIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    function toArabicIndicNumber(num) {
      return String(num).split('').map(d => ARABIC_INDIC_DIGITS[+d] ?? d).join('');
    }


    async function init() {
      setupTouchUnlock();
      renderReciterList();
      await fetchSurahs();
      setupEventListeners();
      setupTVNavigation();
    }


    function setupTouchUnlock() {
      const unlockHandler = () => {
        initAudioContext();
        if (!audio.src || audio.paused) {
          loadSurah(0, true);
        }
        window.removeEventListener('touchstart', unlockHandler);
        window.removeEventListener('click', unlockHandler);
        window.removeEventListener('keydown', unlockHandler);
      };
      window.addEventListener('touchstart', unlockHandler, { once: true });
      window.addEventListener('click', unlockHandler, { once: true });
      window.addEventListener('keydown', unlockHandler, { once: true });
    }


    function initAudioContext() {
      if (isAudioInitialized) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }


      if (window.location.protocol !== 'file:') {
        audio.setAttribute('crossorigin', 'anonymous');
      }


      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          drawSpectrum();
        }
      } catch (e) {
        console.warn("AudioContext init warning.");
      }
      isAudioInitialized = true;
    }


    function drawSpectrum() {
      requestAnimationFrame(drawSpectrum);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);


      if (!analyser) return;


      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);


      const color = getComputedStyle(document.documentElement).getPropertyValue('--lcd-text').trim();
      canvasCtx.fillStyle = color;
      canvasCtx.strokeStyle = color;


      if (vizMode === 0) {
        const barWidth = (canvas.width / bufferLength) * 1.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
          x += barWidth;
        }
      } else if (vizMode === 1) {
        canvasCtx.beginPath();
        canvasCtx.lineWidth = 2;
        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 255.0;
          const y = canvas.height - (v * canvas.height);
          if (i === 0) canvasCtx.moveTo(x, y);
          else canvasCtx.lineTo(x, y);
          x += sliceWidth;
        }
        canvasCtx.stroke();
      } else {
        const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
        const h = (avg / 255) * canvas.height;
        canvasCtx.fillRect(0, canvas.height / 2 - h / 2, canvas.width, Math.max(2, h));
      }
    }


    function renderReciterList() {
      reciterList.innerHTML = '';
      RECITERS.forEach((r) => {
        const item = document.createElement('div');
        item.className = `reciter-option ${r.id === selectedReciterId ? 'selected' : ''}`;
        item.setAttribute('tabindex', '0');
        item.setAttribute('data-id', r.id);
        item.innerHTML = `<span>${r.name}</span>${r.id === selectedReciterId ? '<span>✓</span>' : ''}`;


        const selectHandler = () => {
          selectedReciterId = r.id;
          reciterLabel.textContent = r.name;
          closeReciterModal();
          playAyah(currentAyahIndex, true);
        };


        item.addEventListener('click', selectHandler);
        item.addEventListener('focus', () => item.scrollIntoView({ block: 'nearest' }));
        reciterList.appendChild(item);
      });
    }


    function openReciterModal() {
      reciterModal.classList.add('open');
      const selectedItem = reciterList.querySelector('.reciter-option.selected') || reciterList.firstElementChild;
      if (selectedItem) selectedItem.focus();
    }


    function closeReciterModal() {
      reciterModal.classList.remove('open');
      reciterBtn.focus();
    }


    async function fetchSurahs() {
      try {
        const res = await fetch('https://api.alquran.cloud/v1/surah');
        const data = await res.json();
        surahs = data.data;
        renderPlaylist();
        await loadSurah(0, true);
      } catch (err) {
        lcdTitle.textContent = "خطأ في الاتصال";
      }
    }


    function renderPlaylist() {
      playlistEl.innerHTML = '';
      surahs.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${i === currentSurahIndex ? 'active' : ''}`;
        item.setAttribute('tabindex', '0');
        item.setAttribute('data-index', i);
        item.innerHTML = `<span>${s.number}. ${s.name}</span><span>${s.numberOfAyahs} آية</span>`;
        
        item.addEventListener('click', () => loadSurah(i, true));
        item.addEventListener('focus', () => {
          item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });


        playlistEl.appendChild(item);
      });
    }


    function scrollPlaylistToActive() {
      const activeItem = playlistEl.querySelector('.playlist-item.active');
      if (activeItem) {
        activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }


    function pad3(num) {
      return String(num).padStart(3, '0');
    }


    async function loadSurah(index, autoPlay = true) {
      currentSurahIndex = index;
      const surah = surahs[index];


      document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      scrollPlaylistToActive();


      lcdTitle.textContent = `جاري التحميل... ${surah.name}`;


      totalElapsedBeforeCurrentAyah = 0;
      seekBar.value = 0;


      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/editions/quran-uthmani`);
        const data = await res.json();


        currentAyahsAr = data.data[0].ayahs;
        playAyah(0, autoPlay);
      } catch (err) {
        lcdTitle.textContent = "خطأ في الاتصال";
      }
    }


    function playAyah(index, autoPlay = true) {
      if (!currentAyahsAr || index >= currentAyahsAr.length) return;


      currentAyahIndex = index;
      const surahNum = surahs[currentSurahIndex].number;
      const ayahAr = currentAyahsAr[index];


      arTextEl.innerHTML = `${ayahAr.text} <span class="ayah-marker">﴿${toArabicIndicNumber(ayahAr.numberInSurah)}﴾</span>`;
      textContainer.scrollTop = 0;


      lcdAyahCount.textContent = `آية ${ayahAr.numberInSurah} / ${currentAyahsAr.length}`;


      seekBar.value = 0;


      const reciter = selectedReciterId;
      const formattedSurah = pad3(surahNum);
      const formattedAyah = pad3(index + 1);


      if (index === 0 && surahNum !== 1 && surahNum !== 9) {
        isBasmalahPlaying = true;
        audio.src = `https://everyayah.com/data/${reciter}/001001.mp3`;
      } else {
        isBasmalahPlaying = false;
        audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}${formattedAyah}.mp3`;
      }


      audio.load();


      lcdTitle.textContent = `${surahs[currentSurahIndex].name}`;


      if (autoPlay) {
        initAudioContext();
        audio.play().catch(e => console.log("التشغيل التلقائي يحتاج تفاعل المستخدم."));
      }
    }


    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }


    function setupTVNavigation() {
      window.addEventListener('keydown', (e) => {
        const key = e.key || e.keyCode;
        const active = document.activeElement;


        if (key === 'Enter' || key === 13 || key === 'OK' || key === 'Select') {
          if (active && active !== document.body) {
            e.preventDefault();
            active.click();
          }
          return;
        }


        if (reciterModal.classList.contains('open')) {
          const options = Array.from(reciterList.querySelectorAll('.reciter-option'));
          const curIndex = options.indexOf(active);


          if (key === 'ArrowUp' || key === 38) {
            e.preventDefault();
            if (curIndex > 0) {
              options[curIndex - 1].focus();
              options[curIndex - 1].scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'ArrowDown' || key === 40) {
            e.preventDefault();
            if (curIndex < options.length - 1) {
              options[curIndex + 1].focus();
              options[curIndex + 1].scrollIntoView({ block: 'nearest' });
            }
          } else if (key === 'Back' || key === 'Escape' || key === 27) {
            e.preventDefault();
            closeReciterModal();
          }
          return;
        }


        if (active && active.classList.contains('playlist-item')) {
          const items = Array.from(playlistEl.querySelectorAll('.playlist-item'));
          const curIndex = items.indexOf(active);


          if (key === 'ArrowUp' || key === 38) {
            e.preventDefault();
            if (curIndex > 0) {
              const prev = items[curIndex - 1];
              prev.focus();
              prev.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
              reciterBtn.focus();
            }
          } else if (key === 'ArrowDown' || key === 40) {
            e.preventDefault();
            if (curIndex < items.length - 1) {
              const next = items[curIndex + 1];
              next.focus();
              next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            } else {
              textContainer.focus();
            }
          }
          return;
        }


        if (active && active.tagName === 'INPUT' && active.type === 'range') {
          if (key === 'ArrowLeft' || key === 37) {
            e.preventDefault();
            active.value = Math.max(0, parseFloat(active.value) - 5);
            active.dispatchEvent(new Event('input'));
          } else if (key === 'ArrowRight' || key === 39) {
            e.preventDefault();
            active.value = Math.min(100, parseFloat(active.value) + 5);
            active.dispatchEvent(new Event('input'));
          }
        }
      });


      textContainer.addEventListener('keydown', (e) => {
        const key = e.key || e.keyCode;
        if (key === 'ArrowUp' || key === 38) {
          textContainer.scrollTop -= 40;
          e.preventDefault();
        } else if (key === 'ArrowDown' || key === 40) {
          textContainer.scrollTop += 40;
          e.preventDefault();
        }
      });
    }


    function setupEventListeners() {
      canvas.addEventListener('click', () => {
        vizMode = (vizMode + 1) % 3;
      });


      reciterBtn.addEventListener('click', openReciterModal);
      modalCloseBtn.addEventListener('click', closeReciterModal);
      reciterModal.addEventListener('click', (e) => {
        if (e.target === reciterModal) closeReciterModal();
      });


      playBtn.addEventListener('click', () => {
        initAudioContext();
        audio.play();
      });


      pauseBtn.addEventListener('click', () => audio.pause());
      
      stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
      });


      prevBtn.addEventListener('click', () => {
        if (currentAyahIndex > 0) playAyah(currentAyahIndex - 1, true);
        else if (currentSurahIndex > 0) loadSurah(currentSurahIndex - 1, true);
      });


      nextBtn.addEventListener('click', () => {
        if (currentAyahIndex < currentAyahsAr.length - 1) playAyah(currentAyahIndex + 1, true);
        else if (currentSurahIndex < surahs.length - 1) loadSurah(currentSurahIndex + 1, true);
      });


      audio.addEventListener('ended', () => {
        if (isBasmalahPlaying) {
          isBasmalahPlaying = false;
          if (!isNaN(audio.duration)) {
            totalElapsedBeforeCurrentAyah += audio.duration;
          }
          const reciter = selectedReciterId;
          const formattedSurah = pad3(surahs[currentSurahIndex].number);
          audio.src = `https://everyayah.com/data/${reciter}/${formattedSurah}001.mp3`;
          audio.load();
          audio.play();
          return;
        }


        if (!isNaN(audio.duration)) {
          totalElapsedBeforeCurrentAyah += audio.duration;
        }


        if (currentAyahIndex < currentAyahsAr.length - 1) {
          playAyah(currentAyahIndex + 1, true);
        } else if (currentSurahIndex < surahs.length - 1) {
          loadSurah(currentSurahIndex + 1, true);
        }
      });


      audio.addEventListener('timeupdate', () => {
        const current = audio.currentTime || 0;
        const totalElapsed = totalElapsedBeforeCurrentAyah + (isBasmalahPlaying ? 0 : current);
        lcdTime.textContent = formatTime(totalElapsed);


        if (!isBasmalahPlaying && audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
          seekBar.value = Math.min(100, (current / audio.duration) * 100);
        }
      });


      seekBar.addEventListener('input', () => {
        if (isBasmalahPlaying) return;
        if (!isNaN(audio.duration) && audio.duration > 0) {
          audio.currentTime = (parseFloat(seekBar.value) / 100) * audio.duration;
        }
      });


      volumeBar.addEventListener('input', () => {
        audio.volume = volumeBar.value / 100;
      });


      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    }


    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
